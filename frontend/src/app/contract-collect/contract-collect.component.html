<div class="row" *ngIf="contract">
  <!-- Contract Address - Dates - Creator Address -->
  <div class="col-md-6">
    <nb-card style="height: 50vh;">
      <nb-card-body style="font-weight: 500; font-size: 20px;">
        <!-- <div class="title">{{contract['contract']}}</div> -->
        <div class="fixed-subtitle">Log</div>
      </nb-card-body>
    </nb-card>
  </div>
  <div class="col-md-6 bor">
    <nb-card>
    <!-- <nb-card style="height: 50vh;"> -->
      <nb-card-body style="font-weight: 500; font-size: 20px;">
        <nb-accordion>
          <nb-accordion-item>
            <nb-accordion-item-header class="title" style="font-size: 15px;">
              DATA FROM INTERNET
            </nb-accordion-item-header>
            <nb-accordion-item-body>
              A nebula is an interstellar cloud of dust, hydrogen, helium and other ionized gases.
              Originally, nebula was a name for any diffuse astronomical object,
              including galaxies beyond the Milky Way.
            </nb-accordion-item-body>
          </nb-accordion-item>

          <nb-accordion-item>
            <nb-accordion-item-header class="title" style="font-size: 15px;">
              DATA FROM FILE
            </nb-accordion-item-header>
            <nb-accordion-item-body>
              <input type="file" (change)="onFileSelected($event)">
              <div *ngIf="fileName">
                File selected: {{ fileName }}
              </div>
            </nb-accordion-item-body>
          </nb-accordion-item>
        </nb-accordion>
      </nb-card-body>
    </nb-card>

  </div>

</div>
